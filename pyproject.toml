[project]
name = "interview-app"
version = "0.1.0"
description = "Behavioral job interview practice app with an LLM interviewer and judge"
readme = "README.md"
authors = [
    { name = "r-roemisch", email = "rudolf.roemisch@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "openai>=3.19.2",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
interview-app = "interview_app.main:run"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
